services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subsmgr
      POSTGRES_PASSWORD: subsmgrpass
      POSTGRES_DB: subscription_manager
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsmgr -d subscription_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://subsmgr:subsmgrpass@db:5432/subscription_manager?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:-please-change-this-secret-in-env}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
